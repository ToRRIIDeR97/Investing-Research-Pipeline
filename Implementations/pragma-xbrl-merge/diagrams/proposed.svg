<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">
  <title>Proposed system</title>
  <desc>The warehouse lives under services/xbrl. Companyfacts comes from it when it covers the issuer, else from SEC. Decision synthesis writes stock_rating.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker></defs>
  <rect width="760" height="360" fill="#ffffff"/>
  <text x="20" y="26" font-size="15" font-weight="600" fill="#1e293b">Proposed: one repository, Pragma archived</text>

  <rect x="20" y="44" width="720" height="300" rx="8" fill="#f8fafc" stroke="#64748b"/>
  <text x="34" y="64" font-weight="600" fill="#1e293b">Investing-Research-Pipeline</text>

  <rect x="40" y="80" width="300" height="56" rx="6" fill="#fff" stroke="#15803d" stroke-width="2"/>
  <text x="52" y="100" fill="#1e293b">fetchSecContext → loadCompanyFacts</text>
  <text x="52" y="118" fill="#15803d">AC-6..AC-9 · history/xbrl-warehouse.ts</text>

  <rect x="430" y="80" width="290" height="96" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="442" y="100" font-weight="600" fill="#1e293b">services/xbrl (git subtree, AC-1..AC-3)</text>
  <text x="442" y="120" fill="#1e293b">own docker compose (npm run xbrl:compose)</text>
  <text x="442" y="138" fill="#1e293b">read API at XBRL_WAREHOUSE_URL (AC-4)</text>
  <text x="442" y="156" fill="#475569">own PostgreSQL / ClickHouse / MinIO</text>

  <line x1="340" y1="100" x2="428" y2="110" stroke="#334155" marker-end="url(#a)"/>
  <text x="350" y="94" fill="#334155">covers newest 10-K/10-Q?</text>
  <line x1="190" y1="136" x2="190" y2="164" stroke="#b45309" marker-end="url(#a)"/>
  <text x="200" y="158" fill="#b45309">else data.sec.gov + reason</text>

  <rect x="40" y="170" width="300" height="44" rx="6" fill="#fff" stroke="#94a3b8"/>
  <text x="52" y="196" fill="#1e293b">valuation → decision_synthesis (unchanged)</text>

  <rect x="40" y="232" width="300" height="56" rx="6" fill="#fff" stroke="#15803d" stroke-width="2"/>
  <text x="52" y="252" fill="#1e293b">buildStockRating → stock_rating artifact</text>
  <text x="52" y="270" fill="#15803d">AC-10..AC-13, AC-16 · rating/*.ts</text>
  <line x1="190" y1="214" x2="190" y2="230" stroke="#334155" marker-end="url(#a)"/>

  <rect x="430" y="232" width="290" height="56" rx="6" fill="#fff" stroke="#15803d" stroke-width="2"/>
  <text x="442" y="252" fill="#1e293b">StockRatingPanel + checklist measures</text>
  <text x="442" y="270" fill="#15803d">AC-14, AC-15</text>
  <line x1="340" y1="260" x2="428" y2="260" stroke="#334155" marker-end="url(#a)"/>

  <text x="40" y="320" fill="#475569">Pragma repo: deprecation banner, then archived (AC-0, needs approval). Pragma web, macro suites, Stripe and auth are not carried over.</text>
</svg>
