<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">
  <title>Current system</title>
  <desc>The pipeline reads companyfacts from SEC directly. Pragma and the XBRL warehouse are separate repositories.</desc>
  <rect width="760" height="340" fill="#ffffff"/>
  <text x="20" y="26" font-size="15" font-weight="600" fill="#1e293b">Current: three separate codebases</text>

  <rect x="20" y="50" width="330" height="270" rx="8" fill="#f1f5f9" stroke="#64748b"/>
  <text x="34" y="72" font-weight="600" fill="#1e293b">Investing-Research-Pipeline</text>
  <rect x="40" y="88" width="290" height="44" rx="6" fill="#fff" stroke="#94a3b8"/>
  <text x="52" y="106" fill="#1e293b">fetchSecContext (sources/corpus.ts)</text>
  <text x="52" y="122" fill="#475569">companyfacts + submissions</text>
  <rect x="40" y="148" width="290" height="44" rx="6" fill="#fff" stroke="#94a3b8"/>
  <text x="52" y="166" fill="#1e293b">filing-statements.ts + repair specialist</text>
  <text x="52" y="182" fill="#475569">iXBRL statements from filing HTML</text>
  <rect x="40" y="208" width="290" height="44" rx="6" fill="#fff" stroke="#94a3b8"/>
  <text x="52" y="226" fill="#1e293b">valuation → decision_synthesis</text>
  <text x="52" y="242" fill="#475569">returns + thesis; no grade, no trend check</text>
  <text x="40" y="280" fill="#475569">research_artifacts (PostgreSQL)</text>

  <rect x="400" y="50" width="340" height="120" rx="8" fill="#fef2f2" stroke="#b91c1c"/>
  <text x="414" y="72" font-weight="600" fill="#1e293b">Pragma (separate repo)</text>
  <text x="414" y="94" fill="#1e293b">PragValue: engine router, DCF, CIS,</text>
  <text x="414" y="110" fill="#1e293b">A+ to F deviation grade, PQ composite</text>
  <text x="414" y="132" fill="#1e293b">PragTrend: 9 rules, RS rating, Mansfield RS</text>
  <text x="414" y="154" fill="#475569">+ macro indices, Stripe, auth, admin (dropped)</text>

  <rect x="400" y="190" width="340" height="130" rx="8" fill="#eff6ff" stroke="#1d4ed8"/>
  <text x="414" y="212" font-weight="600" fill="#1e293b">XBRL-Parser (separate repo)</text>
  <text x="414" y="234" fill="#1e293b">Arelle → PostgreSQL, ClickHouse, MinIO</text>
  <text x="414" y="254" fill="#1e293b">FastAPI read API (/v1/facts, /v1/series, …)</text>
  <text x="414" y="274" fill="#475569">SEC, ESEF, EDINET, DART, inbox sources</text>
  <text x="414" y="296" fill="#475569">not used by the pipeline</text>

  <line x1="40" y1="110" x2="20" y2="110" stroke="#b45309" stroke-width="2"/>
  <text x="200" y="300" fill="#b45309">→ data.sec.gov (direct)</text>
</svg>
