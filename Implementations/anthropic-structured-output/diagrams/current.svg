<svg xmlns="http://www.w3.org/2000/svg" width="680" height="520" viewBox="0 0 680 520" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif">
<title id="t">Current: the output schema never leaves the runner</title>
<desc id="d">A stage handler passes a zod-derived output contract to runResearchAgent. The runner sends only model, system, prompt and limits to the provider. anthropic-direct and OpenCode Go (for qwen and minimax) both use AnthropicCompatibleProvider, which posts an unconstrained Messages request. Claude Haiku 5.5 writes free text; the runner parses and validates it with zod, and 64 of 255 calls in three META runs failed first-pass validation and needed a repair request that quotes the schema in the prompt.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5"/></marker></defs>
