<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" font-family="Inter, Arial, sans-serif">
<title>Implementation detail for scope A</title>
<desc>Phase 1 changes validateReviewOutcome and addAiReviewCoverage so the review verdict is a warning, and reviewDraftedReport so it reviews once with no repair or rework. Phase 2 changes nextRequestBatch to allow one pre-draft round, ownerAnswer and processResearchRequests so answers never rerun, and requestResetPlan so only the valuation check's automatic rework reruns and nothing pauses for approval.</desc>
<rect width="680" height="400" fill="#FFFFFF"/>
<g font-size="14" font-weight="500" fill="#2C2C2A"><text x="40" y="34">P1 advisory review</text><text x="360" y="34">P2 one round, no answer reruns</text></g>
<g stroke-width="0.5">
<rect x="40" y="50" width="280" height="64" rx="8" fill="#EEEDFE" stroke="#534AB7"/>
<rect x="40" y="130" width="280" height="64" rx="8" fill="#EEEDFE" stroke="#534AB7"/>
<rect x="40" y="210" width="280" height="64" rx="8" fill="#EEEDFE" stroke="#534AB7"/>
<rect x="360" y="50" width="280" height="64" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
<rect x="360" y="130" width="280" height="64" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
<rect x="360" y="210" width="280" height="64" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
<rect x="360" y="290" width="280" height="64" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
</g>
<g dominant-baseline="central">
<text x="56" y="72" font-size="13" font-weight="500" fill="#3C3489">validateReviewOutcome  AC-1</text><text x="56" y="94" font-size="12" fill="#534AB7">verdict → warning; missing review still fails</text>
<text x="56" y="152" font-size="13" font-weight="500" fill="#3C3489">addAiReviewCoverage  AC-8</text><text x="56" y="174" font-size="12" fill="#534AB7">ai_review_outcome not required</text>
<text x="56" y="232" font-size="13" font-weight="500" fill="#3C3489">reviewDraftedReport  AC-2, AC-3</text><text x="56" y="254" font-size="12" fill="#534AB7">one review; no write, no rework</text>
<text x="376" y="72" font-size="13" font-weight="500" fill="#085041">nextRequestBatch  AC-3, AC-4</text><text x="376" y="94" font-size="12" fill="#0F6E56">one pre-draft round, no post-review</text>
<text x="376" y="152" font-size="13" font-weight="500" fill="#085041">ownerAnswer  AC-5</text><text x="376" y="174" font-size="12" fill="#0F6E56">no requires_rerun offered or kept</text>
<text x="376" y="232" font-size="13" font-weight="500" fill="#085041">requestResetPlan  AC-6, AC-7</text><text x="376" y="254" font-size="12" fill="#0F6E56">auto once for valuation, else none</text>
<text x="376" y="312" font-size="13" font-weight="500" fill="#085041">processResearchRequests  AC-7</text><text x="376" y="334" font-size="12" fill="#0F6E56">never pauses, never inserts approval</text>
</g>
<text x="40" y="380" font-size="12" fill="#5F5E5A">Kept: both human gates, the position guard, legacy approval decisions, no migration.</text>
</svg>
