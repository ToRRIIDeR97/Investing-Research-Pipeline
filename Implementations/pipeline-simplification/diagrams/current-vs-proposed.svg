<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" role="img" font-family="Inter, Arial, sans-serif">
<title>Report flow: current versus proposed (scope A)</title>
<desc>Current: report draft with two question rounds and owner reruns, a review whose verdict gates the run, post-review questions with reruns and approval prompts, a repair rewrite and second review, then a failed run or human review. Proposed: one question round where answers never rerun, the valuation check's one automatic rework, one advisory review, then the human review gate with the verdict and findings.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="470" fill="#FFFFFF"/>
<g font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle"><text x="170" y="30">Current</text><text x="510" y="30">Proposed (scope A)</text></g>
<g stroke-width="0.5">
<rect x="40" y="50" width="260" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A"/>
<rect x="40" y="136" width="260" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A"/>
<rect x="40" y="222" width="260" height="56" rx="8" fill="#FAECE7" stroke="#993C1D"/>
<rect x="40" y="308" width="260" height="56" rx="8" fill="#FAECE7" stroke="#993C1D"/>
<rect x="40" y="394" width="260" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A"/>
<rect x="380" y="50" width="260" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
<rect x="380" y="136" width="260" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
<rect x="380" y="222" width="260" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
<rect x="380" y="308" width="260" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A"/>
</g>
<g text-anchor="middle" dominant-baseline="central">
<text x="170" y="70" font-size="14" font-weight="500" fill="#444441">report_draft</text><text x="170" y="88" font-size="12" fill="#5F5E5A">2 question rounds, owner reruns</text>
<text x="170" y="156" font-size="14" font-weight="500" fill="#444441">ai_reviewer: review</text><text x="170" y="174" font-size="12" fill="#5F5E5A">verdict gates the run</text>
<text x="170" y="242" font-size="14" font-weight="500" fill="#712B13">Post-review questions</text><text x="170" y="260" font-size="12" fill="#993C1D">reruns, approval prompts</text>
<text x="170" y="328" font-size="14" font-weight="500" fill="#712B13">Repair rewrite, review 2</text><text x="170" y="346" font-size="12" fill="#993C1D">fails run if not passing</text>
<text x="170" y="416" font-size="14" font-weight="500" fill="#444441">Failed run, or human review</text>
<text x="510" y="70" font-size="14" font-weight="500" fill="#085041">report_draft</text><text x="510" y="88" font-size="12" fill="#0F6E56">1 round, answers never rerun</text>
<text x="510" y="156" font-size="14" font-weight="500" fill="#085041">Valuation check (code)</text><text x="510" y="174" font-size="12" fill="#0F6E56">one automatic rework, kept</text>
<text x="510" y="242" font-size="14" font-weight="500" fill="#085041">ai_reviewer: one review</text><text x="510" y="260" font-size="12" fill="#0F6E56">advisory, never fails run</text>
<text x="510" y="328" font-size="14" font-weight="500" fill="#444441">human_review gate</text><text x="510" y="346" font-size="12" fill="#5F5E5A">you see verdict, findings</text>
</g>
<g stroke="#5F5E5A" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
<line x1="170" y1="106" x2="170" y2="134"/><line x1="170" y1="192" x2="170" y2="220"/><line x1="170" y1="278" x2="170" y2="306"/><line x1="170" y1="364" x2="170" y2="392"/>
<line x1="510" y1="106" x2="510" y2="134"/><line x1="510" y1="192" x2="510" y2="220"/><line x1="510" y1="278" x2="510" y2="306"/>
</g>
</svg>
