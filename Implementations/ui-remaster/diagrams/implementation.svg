<svg xmlns="http://www.w3.org/2000/svg" width="680" viewBox="0 0 680 470" role="img" font-family="Inter, Arial, sans-serif"><title>Company profile resolution</title><desc>Search Wikidata, match the ticker, read logo and people claims, parse the Wikipedia infobox, fetch photos, cache the result.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#4B5563" stroke-width="1.5"/></marker></defs><rect width="680" height="470" fill="#FFFFFF"/>
<rect x="40" y="30" width="280" height="56" rx="8" fill="#EDF0F4" stroke="#1E3A5F" stroke-width="1"/><text x="180" y="52" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">1. wbsearchentities(clean name)</text><text x="180" y="70" text-anchor="middle" font-size="11" fill="#4B5563">up to 5 candidates</text>
<rect x="360" y="30" width="280" height="56" rx="8" fill="#EDF0F4" stroke="#1E3A5F" stroke-width="1"/><text x="500" y="52" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">2. wbgetentities(candidates)</text><text x="500" y="70" text-anchor="middle" font-size="11" fill="#4B5563">P414/P249 ticker must match</text>
<rect x="40" y="130" width="280" height="56" rx="8" fill="#EDF0F4" stroke="#1E3A5F" stroke-width="1"/><text x="180" y="152" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">3. logo P154, website P856</text><text x="180" y="170" text-anchor="middle" font-size="11" fill="#4B5563">commonsFileUrl, validated</text>
<rect x="360" y="130" width="280" height="56" rx="8" fill="#EDF0F4" stroke="#1E3A5F" stroke-width="1"/><text x="500" y="152" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">4. enwiki infobox section 0</text><text x="500" y="170" text-anchor="middle" font-size="11" fill="#4B5563">key_people, founders, logo</text>
<rect x="40" y="230" width="280" height="56" rx="8" fill="#EDF0F4" stroke="#1E3A5F" stroke-width="1"/><text x="180" y="252" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">5. people: infobox, else P169/P112/P488</text><text x="180" y="270" text-anchor="middle" font-size="11" fill="#4B5563">dedupe, cap 6</text>
<rect x="360" y="230" width="280" height="56" rx="8" fill="#EDF0F4" stroke="#1E3A5F" stroke-width="1"/><text x="500" y="252" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">6. pageimages / P18 photos</text><text x="500" y="270" text-anchor="middle" font-size="11" fill="#4B5563">Wikimedia hosts only</text>
<rect x="200" y="340" width="280" height="56" rx="8" fill="#FFF4D6" stroke="#7A5300" stroke-width="1"/><text x="340" y="362" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">getCompanyProfiles cache</text><text x="340" y="380" text-anchor="middle" font-size="11" fill="#4B5563">resolved / not_found / failed</text>
<path d="M320 58 L358 58" fill="none" stroke="#4B5563" stroke-width="1" marker-end="url(#a)"/>
<path d="M500 86 L500 110 L180 110 L180 128" fill="none" stroke="#4B5563" stroke-width="1" marker-end="url(#a)"/>
<path d="M320 158 L358 158" fill="none" stroke="#4B5563" stroke-width="1" marker-end="url(#a)"/>
<path d="M500 186 L500 210 L180 210 L180 228" fill="none" stroke="#4B5563" stroke-width="1" marker-end="url(#a)"/>
<path d="M320 258 L358 258" fill="none" stroke="#4B5563" stroke-width="1" marker-end="url(#a)"/>
<path d="M500 286 L500 316 L340 316 L340 338" fill="none" stroke="#4B5563" stroke-width="1" marker-end="url(#a)"/>
<text x="40" y="440" font-size="12" fill="#4B5563">No ticker match: null (no wrong logo). Any error: cached as failed for 1 hour, page shows monograms.</text></svg>
