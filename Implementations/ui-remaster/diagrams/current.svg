<svg xmlns="http://www.w3.org/2000/svg" width="680" viewBox="0 0 680 300" role="img" font-family="Inter, Arial, sans-serif"><title>Current UI system</title><desc>Pages read run and asset APIs; tokens are partial and many colours are hard coded; no logos or people.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#4B5563" stroke-width="1.5"/></marker></defs><rect width="680" height="300" fill="#FFFFFF"/>
<rect x="40" y="30" width="180" height="56" rx="8" fill="#F5F6F8" stroke="#D1D5DB" stroke-width="1"/><text x="130" y="52" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">globals.css</text><text x="130" y="70" text-anchor="middle" font-size="11" fill="#4B5563">DM Serif + Inter tokens</text>
<rect x="250" y="30" width="180" height="56" rx="8" fill="#F5F6F8" stroke="#D1D5DB" stroke-width="1"/><text x="340" y="52" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Module CSS + TSX</text><text x="340" y="70" text-anchor="middle" font-size="11" fill="#4B5563">~150 raw hex colours</text>
<rect x="460" y="30" width="180" height="56" rx="8" fill="#F5F6F8" stroke="#D1D5DB" stroke-width="1"/><text x="550" y="52" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">12 pages</text><text x="550" y="70" text-anchor="middle" font-size="11" fill="#4B5563">tables, serif titles</text>
<rect x="40" y="150" width="180" height="56" rx="8" fill="#F5F6F8" stroke="#D1D5DB" stroke-width="1"/><text x="130" y="172" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">/api/assets</text><text x="130" y="190" text-anchor="middle" font-size="11" fill="#4B5563">names only</text>
<rect x="250" y="150" width="180" height="56" rx="8" fill="#F5F6F8" stroke="#D1D5DB" stroke-width="1"/><text x="340" y="172" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">/report?summary=1</text><text x="340" y="190" text-anchor="middle" font-size="11" fill="#4B5563">report_facts on view only</text>
<rect x="460" y="150" width="180" height="56" rx="8" fill="#F5F6F8" stroke="#D1D5DB" stroke-width="1"/><text x="550" y="172" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">/api/review/queue</text><text x="550" y="190" text-anchor="middle" font-size="11" fill="#4B5563">names only</text>
