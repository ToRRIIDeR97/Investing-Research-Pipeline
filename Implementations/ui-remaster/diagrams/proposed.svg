<svg xmlns="http://www.w3.org/2000/svg" width="680" viewBox="0 0 680 420" role="img" font-family="Inter, Arial, sans-serif"><title>Proposed UI system</title><desc>Slate and navy tokens feed every page; shared components show logos, leadership and key numbers from two new APIs and a cached profile service.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#4B5563" stroke-width="1.5"/></marker></defs><rect width="680" height="420" fill="#FFFFFF"/>
<rect x="40" y="30" width="190" height="56" rx="8" fill="#EDF0F4" stroke="#1E3A5F" stroke-width="1"/><text x="135" y="52" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Tokens + palette.ts</text><text x="135" y="70" text-anchor="middle" font-size="11" fill="#4B5563">Slate and navy, Inter (AC-1)</text>
<rect x="250" y="30" width="190" height="56" rx="8" fill="#EDF0F4" stroke="#1E3A5F" stroke-width="1"/><text x="345" y="52" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Shared components</text><text x="345" y="70" text-anchor="middle" font-size="11" fill="#4B5563">Logo, Hero, KeyNumbers (P4)</text>
<rect x="460" y="30" width="180" height="56" rx="8" fill="#EDF0F4" stroke="#1E3A5F" stroke-width="1"/><text x="550" y="52" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">All pages</text><text x="550" y="70" text-anchor="middle" font-size="11" fill="#4B5563">F01-F10 layouts (AC-6)</text>
<rect x="40" y="160" width="190" height="56" rx="8" fill="#FFF4D6" stroke="#7A5300" stroke-width="1"/><text x="135" y="182" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">POST /api/company-profiles</text><text x="135" y="200" text-anchor="middle" font-size="11" fill="#4B5563">batch, 1-40 (AC-5)</text>
<rect x="250" y="160" width="190" height="56" rx="8" fill="#FFF4D6" stroke="#7A5300" stroke-width="1"/><text x="345" y="182" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">GET /api/assets/overview</text><text x="345" y="200" text-anchor="middle" font-size="11" fill="#4B5563">snapshot per asset (AC-5)</text>
<rect x="460" y="160" width="180" height="56" rx="8" fill="#F5F6F8" stroke="#D1D5DB" stroke-width="1"/><text x="550" y="182" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Existing run APIs</text><text x="550" y="200" text-anchor="middle" font-size="11" fill="#4B5563">report summary</text>
<rect x="40" y="290" width="190" height="56" rx="8" fill="#FFF4D6" stroke="#7A5300" stroke-width="1"/><text x="135" y="312" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">company_profiles cache</text><text x="135" y="330" text-anchor="middle" font-size="11" fill="#4B5563">TTL 30d / 7d / 1h (AC-3)</text>
<rect x="250" y="290" width="190" height="56" rx="8" fill="#FFF4D6" stroke="#7A5300" stroke-width="1"/><text x="345" y="312" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">assetSnapshot()</text><text x="345" y="330" text-anchor="middle" font-size="11" fill="#4B5563">price, cases, KPIs (AC-4)</text>
<rect x="460" y="290" width="180" height="56" rx="8" fill="#F5F6F8" stroke="#D1D5DB" stroke-width="1"/><text x="550" y="312" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Wikidata + Wikipedia</text><text x="550" y="330" text-anchor="middle" font-size="11" fill="#4B5563">untrusted, free (AC-2)</text>
<path d="M230 58 L248 58" fill="none" stroke="#4B5563" stroke-width="1" marker-end="url(#a)"/>
<path d="M440 58 L458 58" fill="none" stroke="#4B5563" stroke-width="1" marker-end="url(#a)"/>
<path d="M135 160 L135 100 L300 100 L300 88" fill="none" stroke="#4B5563" stroke-width="1" marker-end="url(#a)"/>
<path d="M345 160 L345 88" fill="none" stroke="#4B5563" stroke-width="1" marker-end="url(#a)"/>
<path d="M550 160 L550 88" fill="none" stroke="#4B5563" stroke-width="1" marker-end="url(#a)"/>
<path d="M135 216 L135 288" fill="none" stroke="#4B5563" stroke-width="1" marker-end="url(#a)"/>
<path d="M345 216 L345 288" fill="none" stroke="#4B5563" stroke-width="1" marker-end="url(#a)"/>
<path d="M230 318 L458 318" fill="none" stroke="#4B5563" stroke-width="1" marker-end="url(#a)"/>
<path d="M550 216 L550 240 L360 240 L360 288" fill="none" stroke="#4B5563" stroke-width="1" marker-end="url(#a)"/>
<text x="40" y="390" font-size="12" fill="#4B5563">Amber = new. Images load from Wikimedia hosts only, no referrer; fallbacks are monograms and initials.</text></svg>
