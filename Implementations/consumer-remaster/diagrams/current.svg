<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300" font-family="Inter, sans-serif" role="img"><title>Current UI data flow</title><desc>Slate tokens feed CSS modules and Recharts charts. Prices stay inside the pipeline. The review page reads the raw queue and the nav badge counts every waiting run.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#78716C" stroke-width="1.5"/></marker></defs>
<rect width="680" height="300" fill="#FFFFFF"/>
<g font-size="13"><rect x="30" y="30" width="190" height="56" rx="8" fill="#F1F3F6" stroke="#9CA3AF"/><text x="125" y="54" text-anchor="middle" font-weight="600">globals.css + palette.ts</text><text x="125" y="72" text-anchor="middle" font-size="11" fill="#6B7280">Slate tokens, Inter + mono</text>
<rect x="250" y="30" width="190" height="56" rx="8" fill="#F1F3F6" stroke="#9CA3AF"/><text x="345" y="54" text-anchor="middle" font-weight="600">CSS modules, Recharts</text><text x="345" y="72" text-anchor="middle" font-size="11" fill="#6B7280">uppercase labels, subtitles</text>
<rect x="470" y="30" width="180" height="56" rx="8" fill="#F1F3F6" stroke="#9CA3AF"/><text x="560" y="54" text-anchor="middle" font-weight="600">Pages</text><text x="560" y="72" text-anchor="middle" font-size="11" fill="#6B7280">static charts</text>
<rect x="30" y="150" width="190" height="56" rx="8" fill="#F1F3F6" stroke="#9CA3AF"/><text x="125" y="174" text-anchor="middle" font-weight="600">market_price_bars</text><text x="125" y="192" text-anchor="middle" font-size="11" fill="#6B7280">read by the pipeline only</text>
<rect x="250" y="150" width="190" height="56" rx="8" fill="#F1F3F6" stroke="#9CA3AF"/><text x="345" y="174" text-anchor="middle" font-weight="600">GET /api/review/queue</text><text x="345" y="192" text-anchor="middle" font-size="11" fill="#6B7280">every waiting run</text>
<rect x="470" y="150" width="180" height="56" rx="8" fill="#FDECEC" stroke="#B42318"/><text x="560" y="174" text-anchor="middle" font-weight="600">Review page, nav badge</text><text x="560" y="192" text-anchor="middle" font-size="11" fill="#B42318">counts superseded runs</text></g>
<line x1="220" y1="58" x2="248" y2="58" stroke="#78716C" marker-end="url(#a)"/><line x1="440" y1="58" x2="468" y2="58" stroke="#78716C" marker-end="url(#a)"/><line x1="440" y1="178" x2="468" y2="178" stroke="#78716C" marker-end="url(#a)"/>
<text x="30" y="250" font-size="11" fill="#6B7280">Sources: src/app/globals.css, src/components/ui/palette.ts, src/components/app-shell.tsx (fetch /api/review/queue length),</text>
<text x="30" y="266" font-size="11" fill="#6B7280">src/lib/market-data/price-history.ts (loadStoredPriceHistory), src/app/review/page.tsx.</text>
</svg>
