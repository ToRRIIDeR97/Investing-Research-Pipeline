<title>Valuation today</title>
<desc>Operating scenarios carry one period of statements. The valuation model writes cash flows, builds, price paths, per-share values and the reverse valuation by hand. Code checks the arithmetic, rescales shares, takes the anchors from the model's price path, and computes the DCF separately, so the two can disagree.</desc>
