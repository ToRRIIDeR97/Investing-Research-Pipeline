<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" width="680" height="420" role="img" font-family="Inter, Segoe UI, Arial, sans-serif"><title>Proposed ai_reviewer flow</title><desc>Mechanical rules are fixed in code, each section gets only its findings, and a content failure in the repair round restores the draft and still reaches human review.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5"/></marker></defs><rect width="680" height="420" fill="#ffffff"/><rect x="40" y="30" width="190" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/><text x="135.0" y="50.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">Stored draft</text><text x="135.0" y="68.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">report_draft, valid</text><rect x="260" y="30" width="190" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/><text x="355.0" y="50.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">Review round 0</text><text x="355.0" y="68.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">unchanged</text><line x1="230" y1="58" x2="258" y2="58" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/><rect x="40" y="140" width="190" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="135.0" y="160.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#04342C">Re-plan outline</text><text x="135.0" y="178.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">AC-1 normalizer fixed</text><rect x="260" y="140" width="190" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="355.0" y="160.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#04342C">Rewrite sections</text><text x="355.0" y="178.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">AC-2 gap, AC-5 scoped</text><rect x="480" y="140" width="160" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/><text x="560.0" y="160.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">Review round 1</text><text x="560.0" y="178.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">then return</text><path d="M355 86 L355 112 L135 112 L135 138" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/><line x1="230" y1="168" x2="258" y2="168" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/><line x1="450" y1="168" x2="478" y2="168" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/><rect x="40" y="250" width="410" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="245.0" y="270.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#04342C">Content failure: restore draft</text><text x="245.0" y="288.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">AC-3 review marks repair failed</text><line x1="245" y1="196" x2="245" y2="248" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/><rect x="160" y="350" width="390" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/><text x="355.0" y="372.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">Stage completes, human_review gate opens</text><line x1="245" y1="306" x2="245" y2="348" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/><path d="M560 196 L560 330 L480 330 L480 348" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/></svg>