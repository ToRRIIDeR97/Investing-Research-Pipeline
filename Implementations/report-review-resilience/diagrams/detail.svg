<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" width="680" height="380" role="img" font-family="Inter, Segoe UI, Arial, sans-serif"><title>Repair-round failure handling (implementation detail)</title><desc>Model-content failures restore the draft and continue; transient, budget, authentication and code errors keep failing the stage.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5"/></marker></defs><rect width="680" height="380" fill="#ffffff"/><rect x="200" y="30" width="280" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/><text x="340.0" y="50.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">Repair round throws</text><text x="340.0" y="68.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">plan or write, round 1</text><rect x="40" y="140" width="280" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="180.0" y="160.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#04342C">Content failure</text><text x="180.0" y="178.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">schema, output exhausted</text><rect x="360" y="140" width="280" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/><text x="500.0" y="160.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#4A1B0C">Any other error</text><text x="500.0" y="178.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">transient, budget, auth, bug</text><path d="M300 86 L300 112 L180 112 L180 138" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/><path d="M380 86 L380 112 L500 112 L500 138" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/><rect x="40" y="240" width="280" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="180.0" y="260.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#04342C">Re-save draft artifacts</text><text x="180.0" y="278.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">outline, sections, document</text><rect x="360" y="240" width="280" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/><text x="500.0" y="260.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#4A1B0C">Rethrow unchanged</text><text x="500.0" y="278.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">AC-4 retry or stop as now</text><line x1="180" y1="196" x2="180" y2="238" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/><line x1="500" y1="196" x2="500" y2="238" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/><rect x="40" y="310" width="280" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="180.0" y="332.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#04342C">Save round-0 review + repair</text><line x1="180" y1="296" x2="180" y2="308" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/></svg>