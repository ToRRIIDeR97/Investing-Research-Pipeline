<text x="34" y="564" font-size="12" fill="#791f1f">processSourceRequests (collector.ts:45-61)</text>
<text x="34" y="580" font-size="12" fill="#791f1f">always searches; never checks the run corpus</text>
<rect x="350" y="524" width="310" height="86" rx="6" fill="#fcebeb" stroke="#a32d2d"/>
<text x="364" y="546" fill="#791f1f">Run 1d427f3f (Claude Haiku 5.5)</text>
<text x="364" y="564" font-size="12" fill="#791f1f">3 reset cycles (team_requests v1, v3, v4);</text>
<text x="364" y="580" font-size="12" fill="#791f1f">price history captured 4 times; request-1-3</text>
<text x="364" y="596" font-size="12" fill="#791f1f">"unavailable" with the data already stored</text>
