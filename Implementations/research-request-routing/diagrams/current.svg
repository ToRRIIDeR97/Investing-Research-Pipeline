<svg xmlns="http://www.w3.org/2000/svg" width="680" height="626" viewBox="0 0 680 626" role="img" font-family="Helvetica, Arial, sans-serif">
<title>Report requests today</title>
<desc>The report agent's requests are routed to stage roots. Any request that needs sources, or comes from the data role, reopens source_discovery, which resets 20 stages; other requests reset their owner's stage and every dependent. Answers come only after the reruns, from a packet that omits the market price history, the FRED series and research-memory passages. A needs_sources answer re-queues the batch and causes a second reset. Specialist source requests always search the web.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5"/></marker></defs>
<rect width="680" height="626" fill="#ffffff"/>
<text x="20" y="28" font-size="14" font-weight="600" fill="#2c2c2a">Current: report requests reset most of the pipeline (main 594024e3)</text>
<text x="20" y="46" font-size="12" fill="#5f5e5a">Red: where run 1d427f3f went wrong. Dashed: captured data that answers never see.</text>
<g font-size="13" fill="#2c2c2a">
<rect x="20" y="60" width="310" height="64" rx="6" fill="#f1efe8" stroke="#888780"/>
<text x="34" y="82">Report agent asks (ai_reviewer)</text>
<text x="34" y="100" font-size="12" fill="#5f5e5a">requestMissingResearch, team.ts:66-93</text>
<text x="34" y="116" font-size="12" fill="#5f5e5a">at most 5 requests per round, 2 rounds</text>
<rect x="350" y="60" width="310" height="64" rx="6" fill="#fcebeb" stroke="#a32d2d"/>
<text x="364" y="82" fill="#791f1f">team_requests batch: queued</text>
<text x="364" y="100" font-size="12" fill="#791f1f">a new round drops source_escalated</text>
<text x="364" y="116" font-size="12" fill="#791f1f">(team.ts:89-92)</text>
<rect x="20" y="154" width="310" height="64" rx="6" fill="#fcebeb" stroke="#a32d2d"/>
<text x="34" y="176" fill="#791f1f">requestStageRoots (team.ts:106-109)</text>
<text x="34" y="194" font-size="12" fill="#791f1f">needs_sources or role data: source_discovery</text>
<text x="34" y="210" font-size="12" fill="#791f1f">otherwise the owner's stage</text>
<rect x="350" y="154" width="310" height="64" rx="6" fill="#fcebeb" stroke="#a32d2d"/>
<text x="364" y="176" fill="#791f1f">dependentStages (team-plan.ts:64-75)</text>
<text x="364" y="194" font-size="12" fill="#791f1f">source_discovery 20, company_genesis 15,</text>
<text x="364" y="210" font-size="12" fill="#791f1f">historical_record 14, asset_valuation 10</text>
<rect x="20" y="248" width="640" height="48" rx="6" fill="#fcebeb" stroke="#a32d2d"/>
<text x="34" y="269" fill="#791f1f">Reset in one transaction when the batch is queued (team.ts:117-143)</text>
<text x="34" y="287" font-size="12" fill="#791f1f">stages pending, tasks invalid, artifacts needs_more_work, gaps superseded, report approval cleared</text>
<rect x="20" y="326" width="310" height="64" rx="6" fill="#f1efe8" stroke="#888780"/>
<text x="34" y="348">Reopened stages rerun (worker)</text>
<text x="34" y="366" font-size="12" fill="#5f5e5a">source_discovery searches the web again</text>
<text x="34" y="382" font-size="12" fill="#5f5e5a">with the question (source-discovery.ts)</text>
<rect x="350" y="326" width="310" height="80" rx="6" fill="#fcebeb" stroke="#a32d2d"/>
<text x="364" y="348" fill="#791f1f">processing: team_answer per request</text>
<text x="364" y="366" font-size="12" fill="#791f1f">only after the reopened stages complete;</text>
<text x="364" y="382" font-size="12" fill="#791f1f">loadReportInputs omits market_price_history</text>
<text x="364" y="398" font-size="12" fill="#791f1f">and financial_statement_set (store.ts:9-34)</text>
<rect x="20" y="430" width="310" height="64" rx="6" fill="#fcebeb" stroke="#a32d2d"/>
<text x="34" y="452" fill="#791f1f">needs_sources answer (team.ts:170-176)</text>
<text x="34" y="470" font-size="12" fill="#791f1f">re-queued with needs_sources: a second reset</text>
<text x="34" y="486" font-size="12" fill="#791f1f">that now includes source_discovery</text>
<rect x="350" y="430" width="310" height="64" rx="6" fill="#ffffff" stroke="#888780" stroke-dasharray="5 4"/>
<text x="364" y="452">Captured, not used by answers</text>
<text x="364" y="470" font-size="12" fill="#5f5e5a">market_price_history: 1,506 bars</text>
<text x="364" y="486" font-size="12" fill="#5f5e5a">FRED DGS10 file, research-memory passages</text>
