<text x="294" y="470" font-size="11" text-anchor="start" fill="#222" stroke="#ffffff" stroke-width="3" paint-order="stroke">SQL</text>
<path d="M290,390 L540,390 L540,490 L550,490" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#a)"/>
<text x="420" y="394" font-size="11" text-anchor="middle" fill="#222" stroke="#ffffff" stroke-width="3" paint-order="stroke">write files</text>
<path d="M780,110 L850,110" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#a)"/>
<text x="815.0" y="105.0" font-size="11" text-anchor="middle" fill="#222" stroke="#ffffff" stroke-width="3" paint-order="stroke">prompt + key</text>
<path d="M850,140 L780,160" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#a)"/>
<text x="815" y="170" font-size="11" text-anchor="middle" fill="#222" stroke="#ffffff" stroke-width="3" paint-order="stroke">untrusted JSON</text>
<path d="M850,235 L780,180" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#a)"/>
<text x="815" y="250" font-size="11" text-anchor="middle" fill="#222" stroke="#ffffff" stroke-width="3" paint-order="stroke">untrusted pages</text>
<path d="M760,195 L760,214 L815,214 L815,315 L955,315 L955,365" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#a)"/>
<text x="885" y="311" font-size="11" text-anchor="middle" fill="#222" stroke="#ffffff" stroke-width="3" paint-order="stroke">generated code</text>
<path d="M780,500 L850,520" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#a)"/>
<text x="16" y="595" font-size="11" font-weight="normal" text-anchor="start" fill="#555">Red = control gap or high-sensitivity item. Arrows show data direction. Prompt-injection: no 'treat as data' wrapping found for fetched content; output is constrained by</text>
<text x="16" y="610" font-size="11" font-weight="normal" text-anchor="start" fill="#555">structured-output validation and zod staging. Details and line references: docs/security.md.</text>
</svg>
