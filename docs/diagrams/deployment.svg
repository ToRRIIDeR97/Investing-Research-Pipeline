<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 640" width="1060" height="640" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif" font-size="13">
<title id="t">Research OS — UML deployment view (local only)</title><desc id="d">All runtime nodes run on one developer machine: Next.js server, research worker, python3 child processes, ./storage, and a Docker Postgres container. Outbound HTTPS to LLM and data providers. No hosted deployment exists. Machines share research only through the research-store branch on GitHub.</desc>
