<text x="540.0" y="151" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#333">tsx src/workers/research-worker.ts</text>
<text x="540.0" y="166" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#333">env: DATABASE_URL, RESEARCH_*</text>
