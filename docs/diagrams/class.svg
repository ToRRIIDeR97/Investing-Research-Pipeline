<title id="t">Research OS — UML class view (core domain, from src/db/schema)</title><desc id="d">Core persisted domain types and multiplicities: Asset has many ResearchRuns; a run has 24 stages, tasks, jobs, artifacts, model call logs, backtests and review decisions; artifacts link to evidence claims, which link to source locations in parsed documents.</desc>
