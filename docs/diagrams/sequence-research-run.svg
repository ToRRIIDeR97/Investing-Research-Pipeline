<text x="16" y="1370" font-size="11" font-weight="normal" text-anchor="start" fill="#555">Same pattern repeats at stage 22 human_review (POST …/review writes review_decisions; approve → enqueue). Final checks call completeRun or set needs_more_work.</text>
