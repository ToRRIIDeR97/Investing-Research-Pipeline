<text x="840.0" y="545" font-size="11" text-anchor="middle" fill="#222" stroke="#ffffff" stroke-width="3" paint-order="stroke">schema-validated output (repair/retry)</text>
<path d="M770,578 L350,578" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#a)"/>
<text x="560.0" y="573" font-size="11" text-anchor="middle" fill="#222" stroke="#ffffff" stroke-width="3" paint-order="stroke">persist artifacts, evidence, tasks, model_call_logs</text>
