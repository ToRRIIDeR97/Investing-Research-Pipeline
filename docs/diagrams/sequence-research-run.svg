<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 1380" width="1120" height="1380" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif" font-size="13">
<title id="t">Research run — UML sequence view</title><desc id="d">Ordered messages from run creation through enqueue, worker claim, advisory lock, parallel stage execution with model calls, report requests answered without stage resets and the re-run approval, plan gate pause, approval and re-enqueue, the lease-expiry retry path, and cancel or shutdown.</desc>
