<text x="140.0" y="865" font-size="11" text-anchor="middle" fill="#222" stroke="#ffffff" stroke-width="3" paint-order="stroke">POST …/request-reset {rerun | skip}</text>
<path d="M210,898 L350,898" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#a)"/>
<text x="280.0" y="893" font-size="11" text-anchor="middle" fill="#222" stroke="#ffffff" stroke-width="3" paint-order="stroke">approveRequestReset + enqueue new job</text>
