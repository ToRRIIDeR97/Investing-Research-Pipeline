<path d="M490,1264 L910,1264" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#a)"/>
<text x="700.0" y="1259" font-size="11" text-anchor="middle" fill="#222" stroke="#ffffff" stroke-width="3" paint-order="stroke">abort signal → in-flight model call cancelled</text>
<path d="M490,1292 L350,1292" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#a)"/>
<text x="420.0" y="1287" font-size="11" text-anchor="middle" fill="#222" stroke="#ffffff" stroke-width="3" paint-order="stroke">release job → queued, no attempt used [owner]</text>
