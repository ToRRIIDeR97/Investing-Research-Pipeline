<text x="490.0" y="959" font-size="11" text-anchor="middle" fill="#222" stroke="#ffffff" stroke-width="3" paint-order="stroke">run + stage → waiting_for_human; release lock</text>
<path d="M490,992 L350,992" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#a)"/>
<text x="420.0" y="987" font-size="11" text-anchor="middle" fill="#222" stroke="#ffffff" stroke-width="3" paint-order="stroke">completeResearchRunJob (owner-guarded)</text>
<path d="M70,1020 L210,1020" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#a)"/>
