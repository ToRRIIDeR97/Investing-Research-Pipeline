<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" width="1100" height="700" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif" font-size="13">
<title id="t">Research OS — UML component view (current)</title><desc id="d">Browser UI calls unauthenticated Next.js API routes; the API writes Postgres and enqueues jobs; a separate worker claims jobs and runs the 24-stage pipeline, which calls the agent harness, source discovery and ingestion, backtesting (Python), and export; all state lives in Postgres and ./storage.</desc>
