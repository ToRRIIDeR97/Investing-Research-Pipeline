<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 730" width="1320" height="730" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif" font-size="13">
<title id="t">Asset valuation — UML activity view</title><desc id="d">The valuation stage loads code-built inputs, separates FCFF assets, deposit-funded banks and other financials, withholds before any model call when inputs are missing, asks the model only for assumptions (FCFF and banks) or equity schedules (other financials), and assembles the path, anchors, returns and reverse valuation in code.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#333"/></marker></defs>
<rect x="0" y="0" width="1320" height="730" fill="#ffffff"/>
<text x="16" y="26" font-size="16" font-weight="bold" fill="#111">Asset valuation — UML activity view</text>
<circle cx="300" cy="50" r="7" fill="#222"/>
<path d="M300,57 L300,70" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#a)"/>
<rect x="100" y="70" width="400" height="96" rx="6" fill="#f3eefa" stroke="#6f4fa3" stroke-width="1.4"/>
<text x="300.0" y="88" font-size="12" font-weight="bold" text-anchor="middle" fill="#111">Load inputs (code)</text>
<text x="300.0" y="105" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#333">operating_scenario_set yearly_drivers · operating_model</text>
<text x="300.0" y="120" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#333">financial_inputs · historyRatios (PP&amp;E, IC) · equityBridge · shares · analytics pack</text>
<text x="300.0" y="135" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#333">risk-free (FRED DGS10) · beta (market_price_history) · implied ERP · bankCapitalBase (TBV, deposits)</text>
<text x="300.0" y="150" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#333">price: stored close; historical run without one → withheld</text>
<path d="M300,166 L300,186" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#a)"/>
<path d="M300,186 L314,200 L300,214 L286,200 z" fill="#fff8dc" stroke="#8a6d00" stroke-width="1.3"/>
<text x="280" y="182" font-size="11" font-weight="normal" text-anchor="end" fill="#5a4700" font-style="italic">bank archetype or financials profile,</text>
<text x="280" y="195" font-size="11" font-weight="normal" text-anchor="end" fill="#5a4700" font-style="italic">or deposits ≥ 30% of assets?</text>
<path d="M314,200 L760,200 L760,226" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#a)"/>
<text x="600" y="194" font-size="11" text-anchor="middle" fill="#222" stroke="#ffffff" stroke-width="3" paint-order="stroke">yes</text>
<path d="M300,214 L300,236" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#a)"/>
<text x="306" y="230" font-size="11" text-anchor="start" fill="#222" stroke="#ffffff" stroke-width="3" paint-order="stroke">no</text>
<path d="M300,236 L314,250 L300,264 L286,250 z" fill="#fff8dc" stroke="#8a6d00" stroke-width="1.3"/>
<text x="320" y="246" font-size="11" font-weight="normal" text-anchor="start" fill="#5a4700" font-style="italic">ready? drivers for every horizon year,</text>
<text x="320" y="259" font-size="11" font-weight="normal" text-anchor="start" fill="#5a4700" font-style="italic">shares, price, base revenue; FX + ADS ratio if foreign</text>
<path d="M286,250 L40,250 L40,610" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#a)"/>
<text x="160" y="244" font-size="11" text-anchor="middle" fill="#222" stroke="#ffffff" stroke-width="3" paint-order="stroke">no → withheld, no model call</text>
<path d="M300,264 L300,286" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#a)"/>
<text x="306" y="280" font-size="11" text-anchor="start" fill="#222" stroke="#ffffff" stroke-width="3" paint-order="stroke">yes</text>
<rect x="130" y="286" width="340" height="66" rx="6" fill="#e8f1fb" stroke="#3b6ea8" stroke-width="1.4"/>
<text x="300.0" y="304" font-size="12" font-weight="bold" text-anchor="middle" fill="#111">valuation-analyst (model)</text>
<text x="300.0" y="321" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#333">sets: conservative, base, aggressive</text>
<text x="300.0" y="336" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#333">r, g ≤ risk-free, RONIC, fade years (code defaults)</text>
<path d="M300,352 L300,372" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#a)"/>
<rect x="130" y="372" width="340" height="66" rx="6" fill="#f3eefa" stroke="#6f4fa3" stroke-width="1.4"/>
<text x="300.0" y="390" font-size="12" font-weight="bold" text-anchor="middle" fill="#111">Statements → FCFF schedules (code)</text>
<text x="300.0" y="407" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#333">PP&amp;E roll-forward D&amp;A · fade years · timing</text>
<text x="300.0" y="422" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#333">value-driver TV = NOPAT(1+g)(1−g/RONIC)/(r−g)</text>
<path d="M300,438 L300,458" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#a)"/>
<rect x="130" y="458" width="790" height="66" rx="6" fill="#f3eefa" stroke="#6f4fa3" stroke-width="1.4"/>
<text x="525.0" y="476" font-size="12" font-weight="bold" text-anchor="middle" fill="#111">assembleValuation + buildFcffValuation / buildBankValuation (code)</text>
<text x="525.0" y="493" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#333">anchors on the base set · case × set matrix · r × g grid · multiples vs own history · no-rerating · lenses</text>
<text x="525.0" y="508" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#333">reverse: implied multiple and FCF growth, or implied ROTE for banks · sanity flags · stress below bear</text>
<path d="M760,226 L774,240 L760,254 L746,240 z" fill="#fff8dc" stroke="#8a6d00" stroke-width="1.3"/>
<text x="780" y="222" font-size="11" font-weight="normal" text-anchor="start" fill="#5a4700" font-style="italic">deposit-funded bank with tangible equity,</text>
<text x="780" y="234" font-size="11" font-weight="normal" text-anchor="start" fill="#5a4700" font-style="italic">valued in its reporting currency?</text>
<path d="M774,240 L1120,240 L1120,262" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#a)"/>
<text x="1060" y="234" font-size="11" text-anchor="middle" fill="#222" stroke="#ffffff" stroke-width="3" paint-order="stroke">yes</text>
<path d="M760,254 L760,262" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#a)"/>
<rect x="960" y="262" width="340" height="66" rx="6" fill="#e8f1fb" stroke="#3b6ea8" stroke-width="1.4"/>
<text x="1130.0" y="280" font-size="12" font-weight="bold" text-anchor="middle" fill="#111">valuation-analyst (model)</text>
<text x="1130.0" y="297" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#333">bank_valuation_assumptions: cost of equity,</text>
<text x="1130.0" y="312" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#333">RWA growth + target CET1 per year, terminal ROTE, g</text>
<path d="M1120,328 L1120,348" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#a)"/>
<rect x="960" y="348" width="340" height="96" rx="6" fill="#f3eefa" stroke="#6f4fa3" stroke-width="1.4"/>
<text x="1130.0" y="366" font-size="12" font-weight="bold" text-anchor="middle" fill="#111">Excess return on tangible equity (code)</text>
<text x="1130.0" y="383" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#333">B0 = tangible book at the book date</text>
<text x="1130.0" y="398" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#333">B_t = B0 × target / current CET1 × RWA_t / RWA_0</text>
<text x="1130.0" y="413" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#333">RI = NI − r × B_t−1 · TV = B_T(ROTE − r)/(r − g)</text>
<text x="1130.0" y="428" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#333">withheld without a call when an input is missing</text>
<path d="M1120,444 L1120,491 L920,491" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#a)"/>
<rect x="600" y="262" width="320" height="66" rx="6" fill="#e8f1fb" stroke="#3b6ea8" stroke-width="1.4"/>
<text x="760.0" y="280" font-size="12" font-weight="bold" text-anchor="middle" fill="#111">valuation-analyst (model, other financials)</text>
<text x="760.0" y="297" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#333">FCFE, dividend or book method_inputs × 3</text>
<text x="760.0" y="312" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#333">reverse_valuation, or withheld with a reason</text>
<path d="M760,328 L760,344" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#a)"/>
<path d="M760,344 L774,358 L760,372 L746,358 z" fill="#fff8dc" stroke="#8a6d00" stroke-width="1.3"/>
<text x="780" y="352" font-size="11" font-weight="normal" text-anchor="start" fill="#5a4700" font-style="italic">withheld by the model?</text>
<path d="M774,358 L940,358 L940,700 L150,700 L150,676" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#a)"/>
<text x="922" y="352" font-size="11" text-anchor="middle" fill="#222" stroke="#ffffff" stroke-width="3" paint-order="stroke">yes</text>
<path d="M760,372 L760,380" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#a)"/>
<rect x="600" y="380" width="320" height="66" rx="6" fill="#f3eefa" stroke="#6f4fa3" stroke-width="1.4"/>
<text x="760.0" y="398" font-size="12" font-weight="bold" text-anchor="middle" fill="#111">Primary method, shares (code)</text>
<text x="760.0" y="415" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#333">first of fcff, fcfe, dividend, … with 3 scenarios</text>
<text x="760.0" y="430" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#333">diluted shares raised to the reported count</text>
<path d="M760,446 L760,458" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#a)"/>
<path d="M525,524 L525,544" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#a)"/>
<path d="M525,544 L539,558 L525,572 L511,558 z" fill="#fff8dc" stroke="#8a6d00" stroke-width="1.3"/>
<text x="545" y="546" font-size="11" font-weight="normal" text-anchor="start" fill="#5a4700" font-style="italic">every anchor &gt; 0?</text>
<path d="M511,558 L150,558 L150,610" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#a)"/>
<text x="330" y="552" font-size="11" text-anchor="middle" fill="#222" stroke="#ffffff" stroke-width="3" paint-order="stroke">no</text>
<path d="M539,558 L710,558 L710,590" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#a)"/>
<text x="690" y="552" font-size="11" text-anchor="middle" fill="#222" stroke="#ffffff" stroke-width="3" paint-order="stroke">yes</text>
<rect x="20" y="610" width="260" height="66" rx="6" fill="#fdecec" stroke="#b23b3b" stroke-width="1.4"/>
<text x="150.0" y="628" font-size="12" font-weight="bold" text-anchor="middle" fill="#111">Withheld artifacts</text>
<text x="150.0" y="645" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#333">anchors 0 + reason · signals not_applicable</text>
<text x="150.0" y="660" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#333">no scenario anchors; stage completes</text>
<rect x="560" y="590" width="300" height="70" rx="6" fill="#eaf4f4" stroke="#2f7f7f" stroke-width="1.4"/>
<text x="710.0" y="608" font-size="12" font-weight="bold" text-anchor="middle" fill="#111">Persist (handler)</text>
<text x="710.0" y="625" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#333">valuation_signals · scenarios rows · method_schedules</text>
<text x="710.0" y="640" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#333">3 artifacts, validated</text>
