<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="1100" height="560" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif" font-size="13">
<title id="t">Research across runs: lineage, change log and monitoring</title><desc id="d">A new run links to the asset's latest completed or approved run (prior_run_id) and saves a code-built prior_research block that analysis and report packets carry in their cached prefix. Before the report, code diffs the run against the prior into version_change_log. Separately, npm run monitor:check reads new 10-Q/10-K filings from EDGAR, scores the dashboard and stores whether a refresh is due; the asset page shows it and a person decides. No model call, and no run starts on its own.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#333"/></marker></defs>
<rect x="0" y="0" width="1100" height="560" fill="#ffffff"/>
<text x="16" y="26" font-size="16" font-weight="bold" fill="#111">Research across runs: lineage, change log and monitoring</text>
<rect x="30" y="70" width="230" height="100" rx="6" fill="#eaf4f4" stroke="#2f7f7f" stroke-width="1.4"/>
<text x="145.0" y="88" font-size="11" font-weight="normal" text-anchor="middle" fill="#555">«prior run»</text>
<text x="145.0" y="104" font-size="13" font-weight="bold" text-anchor="middle" fill="#111">Run A (completed or approved)</text>
<text x="145.0" y="121" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#333">documents · question_register</text>
<text x="145.0" y="136" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#333">team_requests · decision_record</text>
<text x="145.0" y="151" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#333">valuation_scenario_set</text>
<rect x="330" y="70" width="260" height="100" rx="6" fill="#eef6ec" stroke="#4a8a3f" stroke-width="1.4"/>
<text x="460.0" y="88" font-size="11" font-weight="normal" text-anchor="middle" fill="#555">«transaction»</text>
<text x="460.0" y="104" font-size="13" font-weight="bold" text-anchor="middle" fill="#111">Run creation</text>
<text x="460.0" y="121" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#333">run-service.ts · lineage/runs.ts</text>
<text x="460.0" y="136" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#333">prior_run_id: default, explicit or null</text>
<text x="460.0" y="151" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#333">same asset · pipeline v3</text>
<rect x="660" y="70" width="400" height="100" rx="6" fill="#f3eefa" stroke="#6f4fa3" stroke-width="1.4"/>
<text x="860.0" y="88" font-size="11" font-weight="normal" text-anchor="middle" fill="#555">«artifact»</text>
<text x="860.0" y="104" font-size="13" font-weight="bold" text-anchor="middle" fill="#111">prior_research artifact (≤ 10 KB)</text>
<text x="860.0" y="121" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#333">lineage/prior-research.ts (pure)</text>
<text x="860.0" y="136" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#333">documents, blocked questions, unavailable requests,</text>
<text x="860.0" y="151" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#333">decision, valuation summary, human follow-up</text>
<rect x="330" y="230" width="260" height="110" rx="6" fill="#fdf3e3" stroke="#b07a1f" stroke-width="1.4"/>
<text x="460.0" y="248" font-size="11" font-weight="normal" text-anchor="middle" fill="#555">«model packets»</text>
<text x="460.0" y="264" font-size="13" font-weight="bold" text-anchor="middle" fill="#111">Analysis + report calls (Run B)</text>
<text x="460.0" y="281" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#333">prepareResearchCall adds prior_research</text>
<text x="460.0" y="296" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#333">in the cached packet prefix</text>
<text x="460.0" y="311" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#333">absent → packet byte-identical</text>
<rect x="660" y="230" width="400" height="110" rx="6" fill="#f3eefa" stroke="#6f4fa3" stroke-width="1.4"/>
<text x="860.0" y="248" font-size="11" font-weight="normal" text-anchor="middle" fill="#555">«ai_reviewer start»</text>
<text x="860.0" y="264" font-size="13" font-weight="bold" text-anchor="middle" fill="#111">version_change_log artifact</text>
<text x="860.0" y="281" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#333">lineage/change-log.ts (pure, no model): Run B vs Run A</text>
<text x="860.0" y="296" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#333">valuation per case + weighted, drivers, decision,</text>
<text x="860.0" y="311" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#333">thesis; new documents vs method/model change</text>
<rect x="660" y="400" width="400" height="80" rx="6" fill="#e8f1fb" stroke="#3b6ea8" stroke-width="1.4"/>
<text x="860.0" y="418" font-size="11" font-weight="normal" text-anchor="middle" fill="#555">«report_document»</text>
<text x="860.0" y="434" font-size="13" font-weight="bold" text-anchor="middle" fill="#111">Report</text>
<text x="860.0" y="451" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#333">"Changes since the prior run" section + UI table</text>
<rect x="30" y="400" width="280" height="110" rx="6" fill="#fdf3e3" stroke="#b07a1f" stroke-width="1.4"/>
<text x="170.0" y="418" font-size="11" font-weight="normal" text-anchor="middle" fill="#555">«script»</text>
<text x="170.0" y="434" font-size="13" font-weight="bold" text-anchor="middle" fill="#111">npm run monitor:check</text>
<text x="170.0" y="451" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#333">scripts/monitor-check.ts</text>
<text x="170.0" y="466" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#333">monitoring/monitor-check.ts</text>
<text x="170.0" y="481" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#333">monitoring/monitor-score.ts (pure)</text>
<rect x="30" y="230" width="230" height="110" rx="6" fill="#f4f4f4" stroke="#666666" stroke-width="1.4"/>
<text x="145.0" y="248" font-size="11" font-weight="normal" text-anchor="middle" fill="#555">«external»</text>
<text x="145.0" y="264" font-size="13" font-weight="bold" text-anchor="middle" fill="#111">SEC EDGAR</text>
<text x="145.0" y="281" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#333">data.sec.gov · www.sec.gov only</text>
<text x="145.0" y="296" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#333">10-Q / 10-K after the cutoff</text>
<text x="145.0" y="311" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#333">untrusted filing HTML</text>
<rect x="350" y="420" width="260" height="90" rx="6" fill="#eaf4f4" stroke="#2f7f7f" stroke-width="1.4"/>
<text x="480.0" y="438" font-size="11" font-weight="normal" text-anchor="middle" fill="#555">«table»</text>
<text x="480.0" y="454" font-size="13" font-weight="bold" text-anchor="middle" fill="#111">asset_monitor_checks</text>
<text x="480.0" y="471" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#333">refresh_due · reasons · KPI scores</text>
<text x="480.0" y="486" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#333">→ asset page "Refresh due"</text>
<path d="M260,120 L330,120" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#a)"/>
<text x="295.0" y="115.0" font-size="11" text-anchor="middle" fill="#222" stroke="#ffffff" stroke-width="3" paint-order="stroke">latest run</text>
<path d="M590,120 L660,120" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#a)"/>
<text x="625.0" y="115.0" font-size="11" text-anchor="middle" fill="#222" stroke="#ffffff" stroke-width="3" paint-order="stroke">save once</text>
<path d="M860,170 L860,200 L460,200 L460,230" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#a)"/>
<text x="660" y="194" font-size="11" text-anchor="middle" fill="#222" stroke="#ffffff" stroke-width="3" paint-order="stroke">read per call</text>
<path d="M590,285 L660,285" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#a)"/>
<text x="625.0" y="280.0" font-size="11" text-anchor="middle" fill="#222" stroke="#ffffff" stroke-width="3" paint-order="stroke">Run B artifacts</text>
<path d="M860,340 L860,400" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#a)"/>
<text x="900" y="372" font-size="11" text-anchor="middle" fill="#222" stroke="#ffffff" stroke-width="3" paint-order="stroke">report input</text>
<path d="M145,400 L145,340" fill="none" stroke="#333" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="150" y="372" font-size="11" text-anchor="start" fill="#222" stroke="#ffffff" stroke-width="3" paint-order="stroke">fetch (host allowlist)</text>
<path d="M310,465 L350,465" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#a)"/>
<text x="330.0" y="460.0" font-size="11" text-anchor="middle" fill="#222" stroke="#ffffff" stroke-width="3" paint-order="stroke">store</text>
<text x="16" y="545" font-size="11" font-weight="normal" text-anchor="start" fill="#555">Dashed: reads. A refresh is due on a new 10-Q/10-K, a KPI past its danger line, or a passed next_refresh_at. Paid runs still need a person to create and queue them.</text>
</svg>
