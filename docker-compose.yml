services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: research-os-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: research_os
      # Override with POSTGRES_PASSWORD in the shell or .env; the default is for local development only.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-research_os_dev}
      POSTGRES_DB: research_os
    ports:
      # Loopback only: the research_os role is a superuser in this image.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U research_os -d research_os"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
